{% extends "base.html" %}

{% block title %}
Login | StockFlow
{% endblock %}

{% block login_content %}

<div class="stockflow-login-page">

    <div class="stockflow-login-card">

        <div class="stockflow-login-brand">

            <div class="stockflow-login-brand stockflow-login-brand-full">

                <img src="{{ url_for('static', filename='img/stockflow-logo.png') }}"
                    alt="StockFlow - Gestão de estoque" class="stockflow-login-full-logo">

            </div>

        </div>

        <div class="stockflow-login-heading">
            <h2>Acesse sua conta</h2>
            <p>Entre com suas credenciais para continuar.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="stockflow-login-field">

                <label for="username">
                    Usuário
                </label>

                <div class="stockflow-login-input">

                    <i class="bi bi-person"></i>

                    <input type="text" id="username" name="username" autocomplete="username"
                        placeholder="Digite seu usuário" required autofocus>

                </div>

            </div>


            <div class="stockflow-login-field">

                <label for="password">
                    Senha
                </label>

                <div class="stockflow-login-input stockflow-password-input">

                    <i class="bi bi-lock"></i>

                    <input type="password" id="password" name="password" autocomplete="current-password"
                        placeholder="Digite sua senha" required>

                    <button type="button" class="stockflow-password-toggle" id="toggle-password"
                        aria-label="Mostrar senha" aria-pressed="false">
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

            </div>


            <button type="submit" class="stockflow-login-button">
                Entrar
                <i class="bi bi-arrow-right"></i>
            </button>

        </form>

    </div>

</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("toggle-password");

        if (!passwordInput || !togglePassword) {
            return;
        }

        const toggleIcon =
            togglePassword.querySelector("i");

        togglePassword.addEventListener("click", function () {

            const isHidden =
                passwordInput.type === "password";

            passwordInput.type =
                isHidden ? "text" : "password";

            toggleIcon.className =
                isHidden
                    ? "bi bi-eye-slash"
                    : "bi bi-eye";

            togglePassword.setAttribute(
                "aria-label",
                isHidden
                    ? "Ocultar senha"
                    : "Mostrar senha"
            );

            togglePassword.setAttribute(
                "aria-pressed",
                isHidden ? "true" : "false"
            );

        });

    });
</script>

{% endblock %}
