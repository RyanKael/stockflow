{% extends "base.html" %}

{% block title %}
Alterar senha
{% endblock %}

{% block content %}

<div class="users-form-header mb-4">

    <div>
        <h2 class="users-form-title mb-1">
            Alterar senha
        </h2>

        <p class="users-form-subtitle mb-0">
            Defina uma nova senha para o usuário {{ user.username }}.
        </p>
    </div>

    <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary users-form-back">
        <i class="bi bi-arrow-left"></i>
        Voltar
    </a>

</div>


<div class="card shadow-sm users-form-card">

    <div class="card-body">

        <form method="POST" action="{{ url_for('users.change_password', id=user.id) }}">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="mb-3">

                <label for="password" class="form-label">
                    Nova senha
                </label>

                <div class="users-password-input">

                    <input type="password" id="password" name="password" class="form-control" minlength="8"
                        autocomplete="new-password" required>

                    <button type="button" class="users-password-toggle" data-password-target="password"
                        aria-label="Mostrar senha">
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

                <div class="form-text">
                    A senha deve possuir pelo menos 8 caracteres.
                </div>

            </div>


            <div class="mb-3">

                <label for="confirmation" class="form-label">
                    Confirmar nova senha
                </label>

                <div class="users-password-input">

                    <input type="password" id="confirmation" name="confirmation" class="form-control" minlength="8"
                        autocomplete="new-password" required>

                    <button type="button" class="users-password-toggle" data-password-target="confirmation"
                        aria-label="Mostrar senha">
                        <i class="bi bi-eye"></i>
                    </button>

                </div>

                <div id="password-match-message" class="password-match-message d-none">
                </div>

            </div>


            <div class="users-form-actions">

                <a href="{{ url_for('users.list_users') }}" class="btn btn-outline-secondary">
                    Cancelar
                </a>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-key"></i>
                    Alterar senha
                </button>

            </div>

        </form>

    </div>

</div>


<script>
    document.addEventListener("DOMContentLoaded", function () {

        const toggleButtons =
            document.querySelectorAll(".users-password-toggle");

        const passwordInput =
            document.getElementById("password");

        const confirmationInput =
            document.getElementById("confirmation");

        const matchMessage =
            document.getElementById("password-match-message");

        const submitButton =
            document.querySelector(
                '.users-form-actions button[type="submit"]'
            );


        /* Mostrar / ocultar senha */

        toggleButtons.forEach(function (button) {

            button.addEventListener("click", function () {

                const targetId =
                    button.dataset.passwordTarget;

                const input =
                    document.getElementById(targetId);

                const icon =
                    button.querySelector("i");

                if (!input) {
                    return;
                }

                const isHidden =
                    input.type === "password";

                input.type =
                    isHidden ? "text" : "password";

                icon.className =
                    isHidden
                        ? "bi bi-eye-slash"
                        : "bi bi-eye";

                button.setAttribute(
                    "aria-label",
                    isHidden
                        ? "Ocultar senha"
                        : "Mostrar senha"
                );

            });

        });


        /* Validar confirmação */

        function validatePasswordMatch() {

            const password =
                passwordInput.value;

            const confirmation =
                confirmationInput.value;


            confirmationInput.classList.remove(
                "is-valid",
                "is-invalid"
            );


            if (!confirmation) {

                matchMessage.classList.add("d-none");

                submitButton.disabled = false;

                return;
            }


            matchMessage.classList.remove("d-none");


            if (password === confirmation) {

                confirmationInput.classList.add("is-valid");

                matchMessage.className =
                    "password-match-message password-match-success";

                matchMessage.innerHTML =
                    '<i class="bi bi-check-circle"></i> As senhas coincidem.';

                submitButton.disabled = false;

            }

            else {

                confirmationInput.classList.add("is-invalid");

                matchMessage.className =
                    "password-match-message password-match-error";

                matchMessage.innerHTML =
                    '<i class="bi bi-exclamation-circle"></i> As senhas não coincidem.';

                submitButton.disabled = true;

            }

        }


        passwordInput.addEventListener(
            "input",
            validatePasswordMatch
        );

        confirmationInput.addEventListener(
            "input",
            validatePasswordMatch
        );

    });
</script>

{% endblock %}
